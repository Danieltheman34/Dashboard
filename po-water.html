<!DOCTYPE html>
<html lang="en">
<head>
<script src="/api/config"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1012">
<meta name="color-scheme" content="dark">
<title>Water</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="sync.js" defer></script>
<script src="topbar.js" defer></script>
<!-- =============================================================
     WATER — daily intake in fl oz.
     Storage: po_water_v1 (cloud-synced in the app_state 'health' row)
       unit      'oz' (older versions counted bottles/glasses; those
                 logs are converted to oz once, see toOz())
       logs      { 'YYYY-MM-DD': oz }
       goalOz    custom daily goal, or null for the automatic one
       sizesOz   quick-add sizes [glass, bottle, large bottle]
       profile / weightUnit / caffeineMgPerDay / substances
                 inputs for the automatic goal (profile is also
                 edited from Settings on the home screen)
     ============================================================= -->
<style>
:root {
  --bg: #0F1012;
  --ink: #F2EEE6;
  --dim: #A7A39B;
  --mute: #6C6963;
  --line: rgba(255,255,255,0.07);
  --line-2: rgba(150,190,210,0.22);
  --water: #8EC5E8;
  --water-2: #4F8FB8;
  --serif: 'Instrument Serif', 'Iowan Old Style', Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--dim); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
body { min-height: 100vh; overflow-x: hidden; }
body::before { content: ''; position: fixed; inset: 0; pointer-events: none; background: radial-gradient(55% 40% at 15% 0%, rgba(110,170,210,0.10), transparent 65%); }
main { position: relative; max-width: 820px; margin: 0 auto; padding: 28px 16px 60px; }
.eyebrow { font-size: 11.5px; font-weight: 600; letter-spacing: 0.26em; text-transform: uppercase; color: var(--dim); }
.head { margin: 8px 0 22px; display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.head h1 { font-family: var(--serif); font-style: italic; font-weight: 400; font-size: clamp(44px, 9vw, 62px); color: var(--ink); margin: 6px 0 0; line-height: 1; }
.card { position: relative; border-radius: 22px; padding: 26px; margin-bottom: 14px; border: 1px solid var(--line);
  background: linear-gradient(135deg, #1D2226 0%, #17191C 45%, #141517 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.04), 0 20px 50px rgba(0,0,0,0.35); }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.goal-link { background: none; border: 0; padding: 0; color: var(--dim); font-family: var(--sans); font-size: 15px; cursor: pointer; }
.goal-link:hover { color: var(--ink); }

.hyd { display: grid; grid-template-columns: minmax(180px, 0.8fr) 1.6fr; gap: 28px; align-items: end; margin-top: 34px; }
@media (max-width: 640px) { .hyd { grid-template-columns: 1fr; gap: 22px; margin-top: 22px; } }
.num { display: flex; align-items: flex-end; gap: 10px; }
.num b { font-family: var(--serif); font-weight: 400; font-size: clamp(92px, 20vw, 128px); line-height: 0.8; color: var(--ink); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.num span { font-size: 24px; color: var(--dim); padding-bottom: 6px; }
.sub { font-size: 17px; color: var(--dim); margin-top: 24px; }
.togo { font-size: 17px; color: var(--ink); margin-top: 8px; }
.togo.done { color: var(--water); }

.track { position: relative; height: 54px; border-radius: 999px; background: linear-gradient(180deg, #0B0C0D, #151719); border: 1px solid rgba(255,255,255,0.08); box-shadow: inset 0 2px 8px rgba(0,0,0,0.6); overflow: hidden; }
.fill { position: absolute; inset: 0 auto 0 0; border-radius: 999px; background: linear-gradient(90deg, rgba(79,143,184,0.55), rgba(142,197,232,0.95)); box-shadow: 0 0 24px rgba(142,197,232,0.35); transition: width 0.7s cubic-bezier(0.22,1,0.36,1); }
.fill::after { content: ''; position: absolute; inset: 3px 6px auto 6px; height: 40%; border-radius: 999px; background: linear-gradient(180deg, rgba(255,255,255,0.28), transparent); }
.ticks { position: absolute; inset: 14px 0; display: flex; justify-content: space-evenly; pointer-events: none; }
.ticks i { width: 1px; background: rgba(255,255,255,0.14); }
.scale { display: flex; justify-content: space-between; margin: 14px 4px 0; font-size: 14px; letter-spacing: 0.14em; color: var(--mute); font-variant-numeric: tabular-nums; }
.btns { display: grid; grid-template-columns: 1fr 1fr 1fr 0.5fr; gap: 14px; margin-top: 30px; }
@media (max-width: 460px) { .btns { gap: 8px; } }
.add { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-height: 102px; padding: 12px 6px; border-radius: 18px; cursor: pointer;
  border: 1px solid var(--line-2); background: linear-gradient(180deg, #27323A, #1C2329); color: var(--ink); font-family: var(--sans); transition: transform 0.12s, border-color 0.15s, background 0.15s; }
.add:hover { border-color: rgba(150,190,210,0.4); background: linear-gradient(180deg, #2C3943, #1F272D); }
.add:active { transform: scale(0.97); }
.add b { font-size: 20px; font-weight: 600; letter-spacing: 0.01em; }
.add span { font-size: 12.5px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--dim); text-align: center; line-height: 1.5; }
.add.minus { border-color: var(--line); background: rgba(255,255,255,0.015); }
.add.minus b { color: var(--mute); }
.add:disabled { opacity: 0.4; cursor: default; transform: none; }
@media (max-width: 460px) { .add { min-height: 86px; } .add b { font-size: 17px; } .add span { font-size: 10px; letter-spacing: 0.12em; } }
.flash { animation: flash 0.5s ease-out; }
@keyframes flash { 0% { box-shadow: 0 0 0 0 rgba(142,197,232,0.6); } 100% { box-shadow: 0 0 0 16px rgba(142,197,232,0); } }

/* History */
.chart { position: relative; height: 200px; margin: 26px 0 0 34px; }
.grid-line { position: absolute; left: 0; right: 0; border-top: 1px solid rgba(255,255,255,0.06); }
.grid-line span { position: absolute; left: -34px; top: -9px; width: 28px; text-align: right; font-size: 12px; color: var(--mute); }
.goal-line { position: absolute; left: 0; right: 0; border-top: 2px dashed rgba(142,197,232,0.55); pointer-events: none; z-index: 2; }
.goal-line span { position: absolute; left: 8px; bottom: 6px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.22em; color: var(--water); }
.bars { position: absolute; inset: 0; display: flex; align-items: flex-end; gap: 6px; padding: 0 4px; }
.bar { flex: 1; min-height: 2px; border-radius: 7px 7px 5px 5px; background: linear-gradient(180deg, rgba(142,197,232,0.45), rgba(142,197,232,0.05)); position: relative; }
.bar.hit { background: linear-gradient(180deg, rgba(142,197,232,0.85), rgba(79,143,184,0.25)); }
.bar.today { background: linear-gradient(180deg, #CFE8F7, #4F8FB8); box-shadow: 0 0 20px rgba(142,197,232,0.35); }
.bar.empty { background: rgba(255,255,255,0.04); }
.bar .tip { position: absolute; left: 50%; bottom: calc(100% + 6px); transform: translateX(-50%); background: #24292D; border: 1px solid var(--line); color: var(--ink); font-size: 11.5px; padding: 4px 7px; border-radius: 7px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity 0.15s; z-index: 3; }
.bar:hover .tip { opacity: 1; }
.xl { display: flex; gap: 6px; margin: 10px 0 0 34px; padding: 0 4px; }
.xl span { flex: 1; text-align: center; font-size: 11px; color: var(--mute); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line); }
.stats b { display: block; font-family: var(--serif); font-weight: 400; font-size: 32px; color: var(--ink); line-height: 1; }
.stats span { display: block; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--mute); margin-top: 8px; }

/* Sheet */
.sheet-bg { position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,0.6); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); display: none; align-items: flex-end; justify-content: center; }
.sheet-bg.open { display: flex; }
.sheet { width: 100%; max-width: 480px; max-height: 92vh; overflow-y: auto; background: #17191B; border: 1px solid var(--line); border-bottom: 0; border-radius: 24px 24px 0 0; padding: 20px 20px calc(20px + env(safe-area-inset-bottom)); }
@media (min-width: 640px) { .sheet-bg { align-items: center; } .sheet { border-radius: 24px; border-bottom: 1px solid var(--line); } }
.sheet h3 { font-family: var(--serif); font-style: italic; font-weight: 400; font-size: 30px; color: var(--ink); margin: 0 0 14px; }
.seg { display: inline-flex; padding: 3px; border-radius: 999px; border: 1px solid var(--line); margin-bottom: 14px; }
.seg button { border: 0; background: none; color: var(--dim); font-family: var(--sans); font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; padding: 8px 14px; border-radius: 999px; cursor: pointer; }
.seg button.on { background: rgba(142,197,232,0.16); color: #CFE8F7; }
.field { display: block; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--mute); margin-bottom: 12px; }
.field input { display: block; width: 100%; margin-top: 6px; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: rgba(0,0,0,0.3); color: var(--ink); font-family: var(--sans); font-size: 16px; }
.row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.why { font-size: 13.5px; line-height: 1.6; background: rgba(255,255,255,0.025); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; }
.why div { display: flex; justify-content: space-between; gap: 10px; }
.why div.t { color: var(--ink); border-top: 1px solid var(--line); margin-top: 6px; padding-top: 6px; }
.hint { font-size: 12.5px; color: var(--mute); margin: -4px 0 12px; line-height: 1.5; }
.btn { width: 100%; margin-top: 8px; padding: 15px; border-radius: 15px; border: 1px solid var(--line); background: rgba(255,255,255,0.03); color: var(--ink); font-family: var(--sans); font-size: 15px; font-weight: 600; cursor: pointer; }
.btn.blue { border: 0; background: linear-gradient(180deg, #CFE8F7, #8EC5E8); color: #0B2233; }
</style>
</head>
<body>
<main>
  <div class="head">
    <div><div class="eyebrow">Water · Today</div><h1>Hydration</h1></div>
  </div>

  <div class="card">
    <div class="card-head">
      <div class="eyebrow">Hydration</div>
      <button class="goal-link" id="goalLink" type="button">Goal — oz a day</button>
    </div>
    <div class="hyd">
      <div>
        <div class="num"><b id="num">0</b><span>oz</span></div>
        <div class="sub" id="sub">of — oz · 0%</div>
        <div class="togo" id="togo">—</div>
      </div>
      <div>
        <div class="track" id="track"><div class="fill" id="fill" style="width:0%"></div><div class="ticks" id="ticks"></div></div>
        <div class="scale" id="scale"></div>
        <div class="btns" id="btns"></div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-head"><div class="eyebrow">Last 14 days</div><span id="avgTop" style="font-size:14px"></span></div>
    <div class="chart" id="chart"></div>
    <div class="xl" id="xl"></div>
    <div class="stats" id="stats"></div>
  </div>
</main>

<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script>
(function () {
  'use strict';
  const LS_KEY = 'po_water_v1';
  const ML_PER_OZ = 29.5735;
  const $ = (id) => document.getElementById(id);

  function dayKey(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }

  // Older versions logged a count of bottles/glasses per day — convert those to oz once.
  function toOz(s) {
    if (s.unit === 'oz') return s;
    const vol = s.unit === 'glass' ? (s.glassMl || 250) : s.unit === 'ml' ? 1 : (s.bottleMl || 500);
    Object.keys(s.logs || {}).forEach((k) => { s.logs[k] = Math.round((s.logs[k] || 0) * vol / ML_PER_OZ); });
    s.unit = 'oz';
    return s;
  }
  function load() {
    let s = null;
    try { s = JSON.parse(localStorage.getItem(LS_KEY)); } catch {}
    s = s && typeof s === 'object' ? s : {};
    s.unit = s.unit || 'bottle';
    s.logs = s.logs && typeof s.logs === 'object' ? s.logs : {};
    s.profile = Object.assign({ weightKg: 75, age: 25, sex: 'm', activityHrsPerWeek: 5 }, s.profile || {});
    s.weightUnit = s.weightUnit || 'kg';
    if (s.caffeineMgPerDay == null) s.caffeineMgPerDay = 200;
    s.substances = Array.isArray(s.substances) ? s.substances : [];
    s.sizesOz = Array.isArray(s.sizesOz) && s.sizesOz.length === 3 ? s.sizesOz : [8, 16, 64];
    const wasOz = s.unit === 'oz';
    toOz(s);
    if (!wasOz) save(s);
    return s;
  }
  function save(s) { try { localStorage.setItem(LS_KEY, JSON.stringify(s)); } catch {} }
  let state = load();

  // Automatic goal: 35 ml per kg body weight, +500 ml per hour of training (spread
  // over the week), extra caffeine over 200 mg, any saved meds/stims, +200 ml male,
  // +100 ml age 50+. Same formula the old water coach used.
  function autoBreakdown() {
    const p = state.profile;
    const kg = state.weightUnit === 'lb' ? p.weightKg / 2.20462 : p.weightKg;
    const parts = [
      ['Body weight (' + Math.round(kg) + ' kg × 35 ml)', kg * 35],
      ['Training (' + (p.activityHrsPerWeek || 0) + ' h/wk)', (p.activityHrsPerWeek || 0) / 7 * 500],
      ['Caffeine over 200 mg', Math.max(0, (state.caffeineMgPerDay || 0) - 200) * 1.5],
      ['Meds & stims', state.substances.reduce((t, x) => t + Math.max(0, ((x.dose != null ? x.dose : x.defaultDose) || 0) * (x.mlPerUnit || 0)), 0)],
      ['Sex / age', (p.sex === 'm' ? 200 : 0) + ((p.age || 0) >= 50 ? 100 : 0)],
    ];
    return parts.filter((x) => x[1] > 0);
  }
  function autoGoal() { return Math.max(32, Math.round(autoBreakdown().reduce((t, x) => t + x[1], 0) / ML_PER_OZ / 4) * 4); }
  function goal() { return state.goalOz > 0 ? state.goalOz : autoGoal(); }
  function today() { return state.logs[dayKey(new Date())] || 0; }

  function render() {
    const g = goal(), oz = today(), pct = Math.round(100 * oz / g);
    $('goalLink').textContent = 'Goal ' + g + ' oz a day';
    $('num').textContent = oz;
    $('sub').textContent = 'of ' + g + ' oz · ' + pct + '%';
    const left = g - oz;
    $('togo').textContent = left > 0 ? left + ' oz to go' : 'Goal reached' + (left < 0 ? ' · +' + (-left) + ' oz' : '');
    $('togo').classList.toggle('done', left <= 0);
    $('fill').style.width = Math.min(100, 100 * oz / g) + '%';
    $('ticks').innerHTML = '<i></i>'.repeat(9);
    $('scale').innerHTML = [0, 0.25, 0.5, 0.75, 1].map((f) => '<span>' + Math.round(g * f) + '</span>').join('');
    const [a, b, c] = state.sizesOz;
    $('btns').innerHTML = '<button class="add" type="button" data-oz="' + a + '"><b>+' + a + ' oz</b><span>Glass</span></button>'
      + '<button class="add" type="button" data-oz="' + b + '"><b>+' + b + ' oz</b><span>Bottle</span></button>'
      + '<button class="add" type="button" data-oz="' + c + '"><b>+' + c + ' oz</b><span>Large bottle</span></button>'
      + '<button class="add minus" type="button" data-oz="-' + a + '"' + (oz <= 0 ? ' disabled' : '') + ' aria-label="Remove ' + a + ' oz"><b>−' + a + '</b></button>';
    $('btns').querySelectorAll('.add').forEach((btn) => btn.addEventListener('click', () => {
      state = load();
      const k = dayKey(new Date());
      const v = Math.max(0, (state.logs[k] || 0) + Number(btn.dataset.oz));
      if (v) state.logs[k] = v; else delete state.logs[k];
      save(state); render();
      window.dispatchEvent(new Event('water:changed'));
      $('track').classList.remove('flash'); void $('track').offsetWidth; $('track').classList.add('flash');
      if (navigator.vibrate) navigator.vibrate(10);
    }));
    renderHistory(g);
  }

  function renderHistory(g) {
    const days = [];
    for (let i = 13; i >= 0; i--) { const d = addDays(new Date(), -i), k = dayKey(d); days.push({ d, k, oz: state.logs[k] || 0 }); }
    const max = Math.max(g * 1.25, ...days.map((x) => x.oz));
    const step = max > 200 ? 50 : 25;
    const top = Math.ceil(max / step) * step;
    let html = '';
    for (let v = 0; v <= top; v += step) html += '<div class="grid-line" style="bottom:' + (100 * v / top) + '%"><span>' + v + '</span></div>';
    html += '<div class="goal-line" style="bottom:' + (100 * g / top) + '%"><span>GOAL</span></div>';
    const tk = dayKey(new Date());
    html += '<div class="bars">' + days.map((x) => '<div class="bar' + (!x.oz ? ' empty' : '') + (x.oz >= g ? ' hit' : '') + (x.k === tk ? ' today' : '') + '" style="height:' + Math.max(1, 100 * x.oz / top) + '%"><span class="tip">'
      + x.d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' }) + ' · ' + x.oz + ' oz</span></div>').join('') + '</div>';
    $('chart').innerHTML = html;
    $('xl').innerHTML = days.map((x, i) => '<span>' + (i % 2 === 1 ? x.d.toLocaleDateString(undefined, { weekday: 'narrow' }) : '') + '</span>').join('');
    const logged = days.filter((x) => x.oz > 0);
    const avg = logged.length ? Math.round(logged.reduce((t, x) => t + x.oz, 0) / logged.length) : 0;
    let streak = 0;
    for (let i = (today() >= g ? 0 : 1); ; i++) { if ((state.logs[dayKey(addDays(new Date(), -i))] || 0) >= g) streak++; else break; }
    $('avgTop').textContent = logged.length ? 'Average ' + avg + ' oz a day' : '';
    $('stats').innerHTML = '<div><b>' + (logged.length ? avg : '—') + '</b><span>Avg oz</span></div>'
      + '<div><b>' + days.filter((x) => x.oz >= g).length + '<small style="font-size:18px;color:var(--mute)">/14</small></b><span>Days on goal</span></div>'
      + '<div><b>' + streak + '</b><span>Day streak</span></div>';
  }

  // ---------- Goal sheet ----------
  const sheetBg = $('sheetBg'), sheet = $('sheet');
  function closeSheet() { sheetBg.classList.remove('open'); }
  sheetBg.addEventListener('click', (e) => { if (e.target === sheetBg) closeSheet(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });
  $('goalLink').addEventListener('click', () => {
    let mode = state.goalOz > 0 ? 'custom' : 'auto';
    const ag = autoGoal();
    sheet.innerHTML = '<h3>Daily goal</h3>'
      + '<div class="seg" id="gMode"><button type="button" data-m="auto">Automatic</button><button type="button" data-m="custom">Custom</button></div>'
      + '<div id="gAuto"><div class="why">' + autoBreakdown().map((x) => '<div><span>' + x[0] + '</span><span>' + Math.round(x[1] / ML_PER_OZ) + ' oz</span></div>').join('')
      + '<div class="t"><span>Daily goal</span><span>' + ag + ' oz</span></div></div>'
      + '<div class="hint">Body weight and training hours come from Settings on the home screen.</div></div>'
      + '<div id="gCustom"><label class="field">Ounces a day<input type="number" id="gOz" min="16" max="300" step="4" value="' + (state.goalOz || ag) + '"></label></div>'
      + '<div class="field" style="margin-top:6px">Quick-add sizes (oz)</div>'
      + '<div class="row3">' + ['Glass', 'Bottle', 'Large'].map((l, i) => '<label class="field">' + l + '<input type="number" min="1" max="128" data-size="' + i + '" value="' + state.sizesOz[i] + '"></label>').join('') + '</div>'
      + '<button class="btn blue" id="gSave" type="button">Save</button><button class="btn" id="gCancel" type="button">Cancel</button>';
    const draw = () => {
      $('gMode').querySelectorAll('button').forEach((b) => b.classList.toggle('on', b.dataset.m === mode));
      $('gAuto').hidden = mode !== 'auto'; $('gCustom').hidden = mode !== 'custom';
    };
    $('gMode').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) { mode = b.dataset.m; draw(); } });
    draw();
    $('gCancel').addEventListener('click', closeSheet);
    $('gSave').addEventListener('click', () => {
      state = load();
      const v = parseInt($('gOz').value, 10);
      state.goalOz = mode === 'custom' && v >= 16 ? v : null;
      state.sizesOz = Array.from(sheet.querySelectorAll('[data-size]')).map((inp, i) => Math.max(1, parseInt(inp.value, 10) || state.sizesOz[i]));
      save(state); closeSheet(); render();
    });
    sheetBg.classList.add('open');
  });

  // Synced changes (other devices, or the + in the top bar) → reload and redraw.
  window.addEventListener('storage', () => { state = load(); render(); });
  window.addEventListener('water:changed', () => { state = load(); render(); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { state = load(); render(); } });
  document.addEventListener('DOMContentLoaded', () => {
    if (typeof initCloudSync !== 'function') return;
    initCloudSync({ appKey: 'health', syncedKeys: [LS_KEY], onApplied: () => window.dispatchEvent(new Event('storage')) });
  });
  render();
})();
</script>
</body>
</html>
